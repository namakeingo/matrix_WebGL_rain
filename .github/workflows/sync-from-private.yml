name: Sync from private repository

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-private
  cancel-in-progress: false

env:
  SOURCE_REPO: namakeingo/wallpaper-engine-projects
  # v1.0: selected files from one folder
  V1_SOURCE_DIR: matrix_web_rain
  V1_TARGET_DIR: v1.0
  V1_FILES: audiogen.js index.css index.html index.js preview.gif project.json
  # v2.0: full folder trees
  V2_SRC_SOURCE_DIR: .src/matrix_web_3d_rain
  V2_SRC_TARGET_DIR: v2.0/.src
  V2_BUNDLED_SOURCE_DIR: matrix_web_3d_rain
  V2_BUNDLED_TARGET_DIR: v2.0/bundled

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout private source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _source
          sparse-checkout: |
            ${{ env.V1_SOURCE_DIR }}
            ${{ env.V2_SRC_SOURCE_DIR }}
            ${{ env.V2_BUNDLED_SOURCE_DIR }}
          persist-credentials: false

      - name: Copy files
        run: |
          mkdir -p "$V1_TARGET_DIR" "$V2_SRC_TARGET_DIR" "$V2_BUNDLED_TARGET_DIR"
          for f in $V1_FILES; do
            cp "_source/$V1_SOURCE_DIR/$f" "$V1_TARGET_DIR/$f"
          done
          cp -a "_source/$V2_SRC_SOURCE_DIR/." "$V2_SRC_TARGET_DIR/"
          cp -a "_source/$V2_BUNDLED_SOURCE_DIR/." "$V2_BUNDLED_TARGET_DIR/"
          rm -rf _source

      - name: Commit and push if anything changed
        run: |
          git add -A -- "$V1_TARGET_DIR" "$V2_SRC_TARGET_DIR" "$V2_BUNDLED_TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automatic repository update - $(date -u +%Y/%m/%d)"
          git push
